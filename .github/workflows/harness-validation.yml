name: Harness validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate canonical harness structure
        run: python3 scripts/validate_harness.py
      - name: Test host deployment validation
        run: python3 -B scripts/test_validate_harness.py
      - name: Validate Soluna workflow state
        run: python3 skills/soluna/scripts/test_workflow_state.py
      - name: Compile Soluna scripts
        run: python3 -m compileall -q skills/soluna/scripts
      - name: Check changed lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="$PR_BASE"
          else
            base_ref="$PUSH_BASE"
          fi
          zero_sha=0000000000000000000000000000000000000000
          if [ -z "$base_ref" ] || [ "$base_ref" = "$zero_sha" ]; then
            base_ref="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
          fi
          git diff --check "$base_ref" "$HEAD_SHA"
